name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests include SdkContractTest, which checks the hooks against the real ad SDK binaries.
      - name: Test and build
        run: ./gradlew :module:testDebugUnitTest :module:assembleRelease :module:assembleDebug :sample:assembleDebug

      # Debug builds are signed with this runner's throwaway key: fine for testing, not for releases.
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            module/build/outputs/apk/debug/*.apk
            sample/build/outputs/apk/debug/*.apk
